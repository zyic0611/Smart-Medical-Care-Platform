server:
  port: 8080


#数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_medical?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: root
    password: root

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  #redis配置
  data:
    redis:
      host: localhost
      port: 6379


mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      ddl-enabled: false
      # --- 💡 新增逻辑删除配置 ---
      # 逻辑未删除值 (数据库中存 0 表示有效)
      logic-not-delete-value: 0
      # 逻辑已删除值 (数据库中存 1 表示已删除)
      logic-delete-value: 1
      # 如果你希望全局所有表都默认逻辑删除字段叫 is_deleted，可以加下面这行
      # logic-delete-field: is_deleted

minio:
  endpoint: http://localhost:9000  # 注意是 9000，不是 9001
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: yicheng-medical

